name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 版本号一致性
        run: node tools/sync-version.mjs --check

      - name: 签名密钥不得入库
        shell: bash
        run: |
          if git ls-files --error-unmatch android/keystore.properties 2>/dev/null; then
            echo "::error::android/keystore.properties 被提交进仓库了，请立即移除并更换密钥"
            exit 1
          fi
          if git ls-files --error-unmatch android/keystore/release.jks 2>/dev/null; then
            echo "::error::android/keystore/release.jks 被提交进仓库了，请立即移除并更换密钥"
            exit 1
          fi

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: npm run build

      - name: Go 测试
        run: go test ./... -count=1

      - name: 编译桌面端
        run: go build ./...
