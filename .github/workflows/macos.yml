name: macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to the existing release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go tests
        run: go test ./... -count=1

      - name: Build macOS app
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 build -platform darwin/universal -clean

      - name: Package app and dmg
        run: |
          set -euo pipefail
          APP="build/bin/SJTU Hive.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/SJTU-Hive-${VERSION}-macos-universal.app.zip"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "SJTU Hive" -srcfolder "$STAGE" -ov -format UDZO             "dist/SJTU-Hive-${VERSION}-macos-universal.dmg"
          cd dist
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Launch smoke test
        run: |
          set -euo pipefail
          APP="build/bin/SJTU Hive.app"
          open "$APP"
          sleep 12
          pgrep -fl "SJTU Hive.app/Contents/MacOS/SJTU-Hive" || (echo "app did not start"; exit 1)
          screencapture -x smoke.png
          mkdir -p smoke-logs
          cp -R "$HOME/Library/Logs/SJTU Hive" smoke-logs/ 2>/dev/null || true
          grep -R "menu bar tray ready" smoke-logs/ || (echo "tray log missing"; exit 1)
          pkill -f "SJTU Hive.app/Contents/MacOS/SJTU-Hive" || true

      - uses: actions/upload-artifact@v4
        with:
          name: sjtu-hive-macos-smoke
          path: |
            smoke.png
            smoke-logs/

      - uses: actions/upload-artifact@v4
        with:
          name: sjtu-hive-macos-${{ env.VERSION }}
          path: |
            dist/SJTU-Hive-${{ env.VERSION }}-macos-universal.dmg
            dist/SJTU-Hive-${{ env.VERSION }}-macos-universal.app.zip
            dist/SHA256SUMS.txt

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${VERSION}"             "dist/SJTU-Hive-${VERSION}-macos-universal.dmg"             "dist/SJTU-Hive-${VERSION}-macos-universal.app.zip" --clobber
